name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    name: Typecheck, Unit Tests, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test:unit

      - name: Build
        run: bun run build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dailystand
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dailystand"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dailystand
      BETTER_AUTH_URL: http://127.0.0.1:3000
      BETTER_AUTH_SECRET: ci-super-secret-value
      BETTER_AUTH_TRUSTED_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
      ALLOWED_HOSTS: localhost,127.0.0.1
      API_ALLOWED_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      EMAIL_DIGEST_WORKFLOW_SECRET: ci-workflow-secret
      E2E_USER_EMAIL: alex@dailystand.dev
      E2E_USER_PASSWORD: password123
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create CI env file
        run: |
          cat <<'EOF' > .env.local
          DATABASE_URL=${DATABASE_URL}
          BETTER_AUTH_URL=${BETTER_AUTH_URL}
          BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
          BETTER_AUTH_TRUSTED_ORIGINS=${BETTER_AUTH_TRUSTED_ORIGINS}
          ALLOWED_HOSTS=${ALLOWED_HOSTS}
          API_ALLOWED_ORIGINS=${API_ALLOWED_ORIGINS}
          EMAIL_DIGEST_WORKFLOW_SECRET=${EMAIL_DIGEST_WORKFLOW_SECRET}
          EOF

      - name: Push DB schema
        run: bun run db:push

      - name: Seed DB
        run: bun run db:seed

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: bun run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
